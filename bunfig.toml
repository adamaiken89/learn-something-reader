[test]
preload = ["./src/setup.tsx"]
# Bun enforces coverageThreshold PER-FILE (any single file below → exit 1),
# not on the aggregate. Floor set to current repo minimums
# (min funcs 50%, min lines ~41%) so `bun run coverage` gates new untested
# code without failing on legacy UI files covered by Playwright e2e.
coverageThreshold = { functions = 0.5, lines = 0.4 }
coveragePathIgnorePatterns = ["**/testFsShared.ts", "**/setup.tsx"]
coverageSkipTestFiles = true
pathIgnorePatterns = ["e2e/**", "src/mainview/__e2e__/**"]
